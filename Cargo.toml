[workspace]
members = ["crates/gulu-core", "crates/gulu-storage", "crates/gulu-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[profile.dev]
debug = 1

[profile.release]
strip = "debuginfo"
lto = "thin"

