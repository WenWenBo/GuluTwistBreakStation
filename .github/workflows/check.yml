name: Desktop builds
on:
  push:
    branches:
      - release

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact-path: dist/ota/aarch64-apple-darwin/*
          - platform: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact-path: dist/ota/x86_64-apple-darwin/*
          - platform: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact-path: dist/ota/x86_64-pc-windows-msvc/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/tests -v
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --locked
      - if: runner.os == 'macOS'
        run: scripts/package-macos.sh ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish:
    name: Prepare GitHub Release draft
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true
      - name: Upload draft packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh dist/release
