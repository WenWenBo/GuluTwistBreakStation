name: Verify desktop changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact-path: dist/ota/aarch64-apple-darwin/*
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact-path: dist/ota/x86_64-apple-darwin/*
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact-path: dist/ota/x86_64-pc-windows-msvc/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/tests -v
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - if: runner.os == 'macOS'
        run: scripts/package-macos.sh ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.target }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
